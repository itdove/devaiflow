# Read/write GitHub capability for the DevAIFlow OpenShell image.
#
# OpenShell composes this overlay with its base policy and the selected agent
# policy at sandbox creation time. Credentials are supplied separately by an
# OpenShell provider and are never stored in this file.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/curl }

  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**/info/refs*" }
          - allow: { method: POST, path: "/**/git-upload-pack" }
          - allow: { method: POST, path: "/**/git-receive-pack" }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/git }
